<!--
  E-mail « Confirm signup » de Supabase, en français.
  À coller dans Supabase → Authentication → Emails → Templates → Confirm signup.
  Objet conseillé : Confirme ton adresse e-mail · CampusFlow

  Le lien passe par /auth/confirm avec token_hash : il fonctionne même si l'e-mail
  est ouvert sur un autre appareil que celui de l'inscription.
-->
<div
  style="
    margin: 0;
    padding: 24px 12px;
    background: #f6f4ec;
    font-family: Helvetica, Arial, sans-serif;
    color: #111111;
  "
>
  <div
    style="
      max-width: 480px;
      margin: 0 auto;
      background: #ffffff;
      border: 2px solid #111111;
      border-radius: 24px;
      padding: 32px 28px;
    "
  >
    <p style="margin: 0 0 24px; font-size: 20px; font-weight: 800">
      <span
        style="
          display: inline-block;
          width: 32px;
          height: 32px;
          line-height: 32px;
          text-align: center;
          background: #ffd23f;
          border: 2px solid #111111;
          border-radius: 10px;
          margin-right: 8px;
        "
        >C</span
      >CampusFlow
    </p>
    <h1 style="margin: 0 0 12px; font-size: 28px; line-height: 1.1; font-weight: 800">
      Bienvenue !
    </h1>
    <p style="margin: 0 0 24px; font-size: 16px; line-height: 1.5">
      Il ne reste qu'une étape : confirme ton adresse e-mail pour activer ton compte.
    </p>
    <p style="margin: 0 0 28px">
      <a
        href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/dashboard"
        style="
          display: inline-block;
          background: #ffd23f;
          color: #111111;
          border: 2px solid #111111;
          border-radius: 999px;
          padding: 14px 28px;
          font-size: 16px;
          font-weight: 800;
          text-decoration: none;
        "
      >
        Confirmer mon adresse
      </a>
    </p>
    <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #4a4a4a">
      Tu n'as pas créé de compte CampusFlow ? Ignore simplement cet e-mail.
    </p>
  </div>
</div>
