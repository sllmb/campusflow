<!--
  E-mail « Reset password » de Supabase, en français.
  À coller dans Supabase → Authentication → Emails → Templates → Reset password.
  Objet conseillé : Choisis un nouveau mot de passe · CampusFlow

  Le lien passe par /auth/confirm avec token_hash : il fonctionne même si l'e-mail
  est ouvert sur un autre appareil que celui de la demande.
-->
<div
  style="
    margin: 0;
    padding: 24px 12px;
    background: #f6f4ec;
    font-family: Helvetica, Arial, sans-serif;
    color: #111111;
  "
>
  <div
    style="
      max-width: 480px;
      margin: 0 auto;
      background: #ffffff;
      border: 2px solid #111111;
      border-radius: 24px;
      padding: 32px 28px;
    "
  >
    <p style="margin: 0 0 24px; font-size: 20px; font-weight: 800">CampusFlow</p>
    <h1 style="margin: 0 0 12px; font-size: 28px; line-height: 1.1; font-weight: 800">
      Nouveau mot de passe
    </h1>
    <p style="margin: 0 0 24px; font-size: 16px; line-height: 1.5">
      Tu as demandé à changer ton mot de passe. Touche le bouton pour en choisir un nouveau. Le lien
      est valable une heure.
    </p>
    <p style="margin: 0 0 28px">
      <a
        href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/nouveau-mot-de-passe"
        style="
          display: inline-block;
          background: #ffd23f;
          color: #111111;
          border: 2px solid #111111;
          border-radius: 999px;
          padding: 14px 28px;
          font-size: 16px;
          font-weight: 800;
          text-decoration: none;
        "
      >
        Choisir un nouveau mot de passe
      </a>
    </p>
    <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #4a4a4a">
      Tu n'as rien demandé ? Ignore cet e-mail : ton mot de passe ne change pas.
    </p>
  </div>
</div>
